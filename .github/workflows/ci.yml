name: CI

on:
  push:
    branches: [main, master, base, 'devin/**']
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} — Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, openssl, pdo_sqlite, simplexml, dom, json
          coverage: none
          tools: none

      - name: Show PHP version
        run: php -v

      - name: Syntax check (lint -p) every PHP file
        run: |
          set -e
          find src tests -type f -name '*.php' -print0 \
            | xargs -0 -n 1 -P 4 php -l > /tmp/lint.log 2>&1 \
            || (cat /tmp/lint.log && exit 1)
          # Surface only failures (and a summary line)
          if grep -v 'No syntax errors detected' /tmp/lint.log; then
            echo "::error::PHP syntax errors detected"
            exit 1
          fi
          echo "All PHP files pass syntax check"

      - name: Cache PHPUnit phar
        id: phpunit-cache
        uses: actions/cache@v4
        with:
          path: tools/phpunit.phar
          key: phpunit-10.5.20

      - name: Download PHPUnit
        if: steps.phpunit-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -fsSL --retry 3 https://phar.phpunit.de/phpunit-10.5.20.phar -o tools/phpunit.phar
          chmod +x tools/phpunit.phar

      - name: PHPUnit
        run: php tools/phpunit.phar --colors=always
